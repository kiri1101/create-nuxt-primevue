name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The first commit of a generated project needs an identity, and CI has none.
env:
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # pnpm and yarn (Berry) come from corepack, bun from its own action. With E2E_FULL and CI set, a
      # manager that is not installed fails its case instead of skipping it.
      - run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          corepack prepare yarn@stable --activate
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_FULL: "1"

  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      # Windows path handling and the .gitignore workaround matter most here: only the default case runs.
      # Run by file path: a missing file fails the job, where a name filter could silently select nothing.
      - run: npx vitest run --config vitest.e2e.config.ts e2e/windows.e2e.ts
        env:
          E2E_WINDOWS: "1"

  # Unit tests only (about 2.5 minutes), so it runs in full: no incremental cache. The break threshold in
  # stryker.config.json fails the job when the score drops.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
